version: '3.8'

services:
    web:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "3000:3000"
        environment:
            - MONGO=mongodb://mongo:27017/hs_computer_certification
        depends_on:
            - mongo
        restart: unless-stopped

    mongo:
        image: mongo:6.0
        ports:
            - "27017:27017"
        volumes:
            - mongo_data:/data/db
        restart: unless-stopped

volumes:
    mongo_data: